<title>Radiologie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Literata:opsz,wght@7..72,500;7..72,650&display=swap">
<style>
/* Layout: a reading room. The library (worklist) stays on the left, the fiche sits on the light box with a sticky table of contents; figures open in a film viewer. On a phone, one pane at a time. */
:root{
  --bg:#f1f3f6; --surface:#ffffff; --sunk:#e6eaf0; --line:#d3d9e2; --line-soft:#e3e7ee;
  --fg:#16202b; --muted:#566273; --accent:#2350a8; --accent-soft:#e1e8f6;
  --good:#1f7a4d; --good-soft:#e0f0e7; --warn:#8a5d06; --warn-soft:#f6ecd5; --bad:#b0352b; --bad-soft:#f7e2df;
  --dd:#8a5d06; --dd-soft:#f6ecd5; --dd-line:#d9b874;
  --ext:#6b4aa3; --ext-soft:#eee8f7;
  --film:#0c1117; --film-fg:#e4e9f0; --film-muted:#9aa6b6;
  --display:"Literata",Georgia,"Times New Roman",serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px; --hdr:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1218; --surface:#151c25; --sunk:#1b2430; --line:#2b3746; --line-soft:#222c39;
  --fg:#e3e9f1; --muted:#95a3b5; --accent:#82a9f3; --accent-soft:#1c2a42;
  --good:#5cc592; --good-soft:#15301f; --warn:#e2b54b; --warn-soft:#33290f; --bad:#f08a7e; --bad-soft:#3a1d1a;
  --dd:#e7bb55; --dd-soft:#2f2610; --dd-line:#6e5520;
  --ext:#b9a1ec; --ext-soft:#2a2140; --film:#05080c; --film-fg:#e4e9f0; --film-muted:#9aa6b6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1218; --surface:#151c25; --sunk:#1b2430; --line:#2b3746; --line-soft:#222c39;
  --fg:#e3e9f1; --muted:#95a3b5; --accent:#82a9f3; --accent-soft:#1c2a42;
  --good:#5cc592; --good-soft:#15301f; --warn:#e2b54b; --warn-soft:#33290f; --bad:#f08a7e; --bad-soft:#3a1d1a;
  --dd:#e7bb55; --dd-soft:#2f2610; --dd-line:#6e5520;
  --ext:#b9a1ec; --ext-soft:#2a2140; --film:#05080c; --film-fg:#e4e9f0; --film-muted:#9aa6b6; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--display);font-weight:650;line-height:1.2;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.hint{font-size:12.5px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--surface);border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px))}
.topin{max-width:1360px;margin:0 auto;display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;align-items:flex-start;min-width:0;border:0;background:none;padding:0;text-align:left}
.brand b{font-family:var(--display);font-size:19px;font-weight:650;line-height:1.2}
.brand span{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block;flex:none}
.dot.ok{background:var(--good)} .dot.run{background:var(--accent);animation:pulse 1.2s ease-in-out infinite} .dot.warn{background:var(--warn)}
.searchwrap{flex:1 1 260px;min-width:0;max-width:560px;position:relative}
.search{width:100%;font:inherit;font-size:14.5px;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.searchwrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted);pointer-events:none}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.small{padding:4px 10px;font-size:13px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg)}
.btn:disabled{opacity:.45;cursor:default}

/* desk */
.desk{max-width:1360px;margin:18px auto 0;display:grid;gap:22px;grid-template-columns:1fr}
@media (min-width:960px){.desk{grid-template-columns:minmax(290px,340px) minmax(0,1fr);align-items:start}
  .pane-left{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr) + 14px);max-height:calc(100vh - var(--hdr) - 30px);overflow:auto;padding:0 4px 8px 0;overscroll-behavior:contain}}
@media (max-width:959px){.desk.detail .pane-left{display:none}.desk:not(.detail) .pane-right{display:none}}
.pane-left,.pane-right{min-width:0;display:grid;gap:14px;align-content:start}
.back{display:none;justify-self:start;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
@media (max-width:959px){.back{display:inline-block}}

/* library */
.composer{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px}
.composer textarea{width:100%;min-height:76px;resize:vertical;font:inherit;font-size:15px;line-height:1.5;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.alert{border-radius:var(--r);padding:12px 14px;display:grid;gap:6px;background:var(--warn-soft);border:1px solid var(--warn);font-size:14px}
.alert b{color:var(--warn)}
.libhead{display:flex;align-items:center;gap:8px;padding:2px 2px 0}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:2px}
.seg button{border:0;background:none;border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.group{display:grid;gap:2px}
.group > h2{font-family:var(--body);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 10px 4px}
.letter{font-family:var(--mono);font-size:12px;color:var(--muted);padding:8px 10px 2px;border-top:1px solid var(--line-soft)}
.item{border:0;background:none;border-radius:8px;padding:8px 10px;display:grid;gap:2px;text-align:left;width:100%}
.item:hover{background:var(--surface)}
.item.sel{background:var(--accent-soft)}
.item .ent{font-weight:600;font-size:14.5px;line-height:1.35}
.item .sub{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.item .txt{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.item .sub{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#newBtn{order:2}
.searchwrap{order:3}
@media (max-width:959px){.topin{gap:10px}.searchwrap{flex-basis:100%;max-width:none}#newBtn{margin-left:auto;padding:6px 12px;font-size:13.5px}.sheet{padding-top:16px}}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:1px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.run{background:var(--accent-soft);color:var(--accent)} .pill.run::before{animation:pulse 1.2s ease-in-out infinite}
.pill.ext{background:var(--ext-soft);color:var(--ext)}
.pill.err{background:var(--bad-soft);color:var(--bad)}
.pill.dd{background:var(--dd-soft);color:var(--dd)}
.pill.plain::before{display:none}

/* fiche */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px clamp(16px,3.2vw,40px) 26px;display:grid;gap:26px;min-width:0}
.shead{display:grid;gap:10px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.shead h1{font-size:clamp(26px,3.4vw,36px)}
.syn{font-size:14px;color:var(--muted)}
.resume{font-size:16.5px;line-height:1.6;max-width:70ch}
.metarow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr));z-index:4;background:var(--surface);margin-inline:calc(-1 * clamp(16px,3.2vw,40px));padding:8px clamp(16px,3.2vw,40px);border-block:1px solid var(--line-soft);display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
.toc button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:13px;color:var(--muted);white-space:nowrap}
.toc button:hover{color:var(--fg);border-color:var(--accent)}
.toc button.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.toc button.ddchip.on{background:var(--dd);border-color:var(--dd)}
.sec{display:grid;gap:10px;min-width:0;scroll-margin-top:calc(var(--hdr) + 64px)}
.sec > h2{font-size:21px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec > h2 .count{font-family:var(--mono);font-size:12.5px;color:var(--muted);font-weight:400}
.sec h3{font-size:12.5px;font-family:var(--body);font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
ul.lines{margin:0;padding-left:20px;display:grid;gap:7px;max-width:76ch}
ul.lines li{overflow-wrap:anywhere}
ul.lines li::marker{color:var(--muted)}
.ref{display:inline-block;font-family:var(--mono);font-size:10.5px;line-height:1.6;padding:0 6px;margin-left:5px;border-radius:4px;background:var(--sunk);color:var(--muted);border:0;vertical-align:1px;white-space:nowrap}
button.ref:hover{color:var(--accent);background:var(--accent-soft)}
.answer{border:1.5px solid var(--accent);border-radius:var(--r);padding:14px 18px;display:grid;gap:8px}
.keybox{background:var(--accent-soft);border-radius:var(--r);padding:14px 18px;display:grid;gap:8px}
.answer h2,.keybox h2{font-size:13px;color:var(--accent);font-family:var(--body);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.keybox ul.lines{font-size:15.5px}
.modgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.mod{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px;align-content:start;min-width:0}
.mod h3{color:var(--accent)}
.mod ul.lines{padding-left:18px;font-size:14.5px}
.uncovered{font-size:13.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:12px}

/* differential */
.ddlist{display:grid;gap:12px}
.ddcard{border:1px solid var(--line);border-left:3px solid var(--dd-line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px;min-width:0;scroll-margin-top:calc(var(--hdr) + 64px)}
.ddcard .ddname{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ddcard .ddname b{font-size:16px}
.ddcard p{max-width:74ch}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.thumb{flex:none;width:132px;border:1px solid var(--dd-line);border-radius:6px;overflow:hidden;background:var(--film);padding:0;display:grid}
.thumb img{width:132px;height:100px;object-fit:contain;display:block}
.thumb span{font-size:11px;line-height:1.3;padding:4px 6px;background:var(--dd-soft);color:var(--dd);text-align:left;font-weight:500}

/* images */
.gallery{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr))}
figure.fig{margin:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);display:grid;grid-template-rows:auto 1fr;min-width:0}
figure.fig.ddfig{border-color:var(--dd-line)}
.film{background:var(--film);display:flex;justify-content:center;align-items:center;height:190px;cursor:zoom-in;border:0;padding:0;width:100%}
.film img{max-width:100%;max-height:190px;display:block;object-fit:contain}
figure.fig figcaption{padding:8px 10px 10px;font-size:13px;line-height:1.45;display:grid;gap:4px;align-content:start}
.why{color:var(--fg);font-weight:500}
.cap{color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.src{font-family:var(--mono);font-size:11px;color:var(--muted)}
.ddtag{justify-self:start;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--dd-soft);color:var(--dd)}

/* tree */
ol.tree{margin:0;padding:0;list-style:none;counter-reset:q;display:grid;gap:10px;max-width:80ch}
ol.tree li{counter-increment:q;display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start}
ol.tree li::before{content:counter(q);font-family:var(--mono);font-size:12px;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);display:grid;place-items:center}
ol.tree .q{font-weight:600}
ol.tree .br{display:grid;gap:3px;font-size:14px;margin-top:3px}
ol.tree .br b{font-family:var(--mono);font-size:11px;color:var(--muted);margin-right:6px}

.notebox{border-radius:8px;background:var(--sunk);padding:10px 12px;font-size:14px}
.notebox summary{cursor:pointer;color:var(--muted);font-weight:500}
.notebox .n{display:grid;gap:4px;padding-top:8px}
.notebox .n + .n{border-top:1px solid var(--line);margin-top:8px}
.notebox p{white-space:pre-wrap;overflow-wrap:anywhere}
.banner{border-radius:8px;padding:10px 12px;font-size:14px;display:grid;gap:4px}
.banner.ext{background:var(--ext-soft);border-left:3px solid var(--ext)} .banner.ext b{color:var(--ext)}
.banner.info{background:var(--sunk)}
.sources{font-size:13px;color:var(--muted);display:grid;gap:4px}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.pager button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;text-align:left;display:grid;gap:1px;min-width:0}
.pager button:hover{border-color:var(--accent)}
.pager button:last-child{text-align:right}
.pager span{font-size:12px;color:var(--muted)}
.pager b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.writing::after{content:"▍";color:var(--accent);animation:pulse 1s steps(2) infinite;margin-left:2px}
ol.steps{list-style:none;margin:0;padding:0;display:flex;gap:6px 16px;flex-wrap:wrap}
ol.steps li{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
ol.steps li::before{content:"";width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line)}
ol.steps li.on{color:var(--fg)} ol.steps li.on::before{border-color:var(--accent);background:var(--accent-soft);animation:pulse 1.2s ease-in-out infinite}
ol.steps li.done{color:var(--fg)} ol.steps li.done::before{border-color:var(--good);background:var(--good)}
ol.steps li.fail::before{border-color:var(--bad);background:var(--bad)}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* home */
.welcome{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px clamp(16px,3vw,32px);display:grid;gap:16px}
.welcome h1{font-size:clamp(24px,3vw,30px)}
.welcome ol{margin:0;padding-left:20px;display:grid;gap:6px;max-width:66ch}
.stats{display:flex;gap:24px;flex-wrap:wrap}
.stats div b{display:block;font-family:var(--mono);font-size:21px;font-weight:500}
.stats div span{font-size:12.5px;color:var(--muted)}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr))}
.fcard{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:0;overflow:hidden;display:grid;grid-template-rows:auto 1fr;text-align:left}
.fcard:hover{border-color:var(--accent)}
.fcard .ph{height:120px;background:var(--film);display:grid;place-items:center;color:var(--film-muted);font-family:var(--display);font-size:30px}
.fcard .ph img{max-width:100%;max-height:120px;object-fit:contain}
.fcard div.t{padding:10px 12px;display:grid;gap:2px}
.fcard b{font-size:14.5px;line-height:1.3}
.fcard span{font-size:12px;color:var(--muted)}

/* lightbox */
.lb{position:fixed;inset:0;background:var(--film);z-index:20;display:grid;grid-template-rows:auto 1fr auto;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));color:var(--film-fg)}
.lbtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
.lbtop .mono{color:var(--film-muted)}
.lbbtn{border:1px solid var(--film-muted);background:none;color:var(--film-fg);border-radius:999px;padding:4px 12px;font-size:13px}
.lbstage{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;min-height:0}
.lbstage img{max-width:100%;max-height:100%;object-fit:contain;justify-self:center;align-self:center;min-height:0}
.lbstage .imgbox{height:100%;min-height:0;display:grid;place-items:center;overflow:hidden}
.lbnav{border:1px solid var(--film-muted);background:none;color:var(--film-fg);border-radius:50%;width:42px;height:42px;font-size:22px;line-height:1}
.lbnav:disabled{opacity:.25}
.lbcap{max-width:90ch;margin:0 auto;display:grid;gap:4px;font-size:14px;max-height:28vh;overflow:auto;padding-top:8px}
.lbcap .mono{font-size:11.5px;color:var(--film-muted)}
.lbcap .c{color:var(--film-muted)}
.lbcap .why{color:var(--film-fg)}
.lbtag{font-size:12px;font-weight:600;padding:1px 9px;border-radius:999px;background:var(--film-fg);color:var(--film)}
.lbtag.dd{background:var(--dd);color:var(--film)}
.modal{position:fixed;inset:0;background:rgba(5,8,12,.5);z-index:15;display:grid;place-items:center;padding:16px}
.modal .card{background:var(--surface);border-radius:var(--r);max-width:720px;width:100%;max-height:80vh;overflow:auto;padding:18px;display:grid;gap:10px}
.modal .card p{font-size:14px;line-height:1.6;white-space:pre-wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
/* Radiologie : onglets, domaine, Bibliothèque, import */
.tabs{display:flex;gap:2px;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;color:var(--muted);font:500 13.5px var(--body);padding:5px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-current="page"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tabs button:focus-visible,.domwrap select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

<script>
"use strict";
/* ================= state ================= */
const S = {
  db: null, user: null, sample: null, mcp: null, assets: null, uid: null, owner: false, booted: false,
  manifest: undefined, books: [], figIndex: [], figById: new Map(), packs: new Map(),
  texts: null, idx: null, textsState: "idle",
  notes: [], fiches: new Map(),
  view: { type: "home" }, detail: false, query: "", sort: "az",
  jobs: new Map(), lb: { list: [], i: 0 },
};
try { const s = localStorage.getItem("nr-sort"); if (s === "az" || s === "recent") S.sort = s; } catch {}
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const slugify = (s) => norm(s).replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 80) || "entite";
const fmtDate = (t) => { try { return new Date(t).toLocaleDateString("fr-BE", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); } catch { return ""; } };
const fmtDay = (t) => { try { return new Date(t).toLocaleDateString("fr-BE", { day: "numeric", month: "short" }); } catch { return ""; } };
const plural = (n, w, ws) => `${n} ${n > 1 ? (ws || w + "s") : w}`;
function toast(msg, ms = 3500) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), ms); }
const BOOK_SHORT = { "cotten-t1": "Cotten t1", "cotten-t2": "Cotten t2", "laredo-t4": "Laredo t4", "laredo-t5": "Laredo t5", "top3-msk": "Top 3 MSK" };
const bookShort = (id) => (S.books.find((b) => b.id === id) || {}).court || BOOK_SHORT[id] || id;
let rafPending = false;
function render() { if (rafPending) return; rafPending = true; requestAnimationFrame(() => { rafPending = false; renderNow(); }); }

/* ================= corpus : magasin indexé (base db de l'artefact) =================
   Rien n'est chargé en bloc. Au démarrage : corpus/manifeste et la liste d'entités du domaine.
   Recherche : seuls les seaux d'index des termes demandés (ix/<n>, ≤ 60 Ko chacun), puis les blocs
   de 16 passages retenus (pb/<livre>-<bloc>). Figures : fm/<livre>-<chapitre>. Images : assets. */
const DELAI = 10000;
function avecDelai(p, ms = DELAI) { let t; return Promise.race([p, new Promise((_, r) => { t = setTimeout(() => r({ code: "timeout" }), ms); })]).finally(() => clearTimeout(t)); }
const docCache = new Map();
S.lus = { docs: 0, octets: 0 };
/* Deux magasins : la base db pour les petites cartes (corpus/…, im/…), assets pour le contenu du corpus,
   en fichiers JSON immuables lus par identifiant et mis en cache par le navigateur. */
function lireDb(path) {
  if (!docCache.has(path)) {
    const p = avecDelai(S.db.doc(path).get()).then((d) => { S.lus.docs++; return d.exists ? d.data() : null; });
    p.catch(() => docCache.delete(path)); docCache.set(path, p);
  }
  return docCache.get(path);
}
/* Corpus : lu à distance dans le dépôt privé GitHub corpus-radio via le connecteur « GitHub »,
   comme PubMed. Un appel = un petit fichier de index/artefact/ (≤ 180 Ko) ; rien n'est stocké dans l'artefact. */
const DEPOT = { owner: "MNADIRI", repo: "corpus-radio", base: "index/artefact/" };
S.gh = null;
function blocRessource(res) {
  for (const b of (res && res.content) || []) if (b && b.resource) return b.resource;
  return null;
}
async function lireGitHub(path) {
  for (let k = 0; ; k++) {
    try {
      const res = await avecDelai(S.mcp.callTool("GitHub", "get_file_contents", { owner: DEPOT.owner, repo: DEPOT.repo, path }), 15000);
      const r = blocRessource(res); if (!r) throw { code: "vide", message: path };
      S.lus.docs++; S.lus.octets += (r.text || r.blob || "").length;
      return r;
    } catch (e) { if (k < 2 && e && (e.code === "rate_limited" || e.code === "upstream_error" || e.code === "timeout")) { await new Promise((r) => setTimeout(r, 900 * (k + 1))); continue; } throw e; }
  }
}
function cheminDistant(path) {
  if (path === "sommaire") return DEPOT.base + "sommaire.json";
  const i = path.indexOf("/"), pre = path.slice(0, i), rest = path.slice(i + 1);
  if (pre === "pb" || pre === "fm") { const j = rest.lastIndexOf("-"); return `${DEPOT.base}${pre}/${rest.slice(0, j)}/${rest.slice(j + 1)}.json`; }
  return `${DEPOT.base}${pre}/${rest}.json`;
}
function lireDoc(path) {
  if (/^(corpus|im)\//.test(path)) return lireDb(path);
  if (!docCache.has(path)) {
    const p = lireGitHub(cheminDistant(path)).then((r) => JSON.parse(r.text));
    p.catch(() => docCache.delete(path)); docCache.set(path, p);
  }
  return docCache.get(path);
}
S.dom = "tous";
try { const d = localStorage.getItem("rad-dom"); if (d) S.dom = d; } catch {}
S.codeBook = new Map(); S.bookById = new Map();
async function loadCorpusMeta() {
  if (!S.owner || !S.mcp) { S.manifest = null; S.metaErr = S.owner ? "mcp" : null; render(); return; }
  try {
    docCache.delete("sommaire");
    const m = await lireDoc("sommaire");
    S.manifest = m;
    S.books = m.livres.map((b) => ({ ...b }));
    S.codeBook = new Map(m.livres.map((b) => [b.code, b]));
    S.bookById = new Map(m.livres.map((b) => [b.id, b]));
    S.STOPW = new Set(m.mots_vides || []);
    S.textsState = "ready";
  } catch (e) { S.manifest = null; S.metaErr = e && e.code ? e.code : "lecture"; }
  render();
  if (S.manifest) chargerEntites().catch(() => {});
}
function chapitre(b, n) { return (b && b.chapitres.find((c) => c.n === n)) || null; }
function domOk(code, ch) {
  if (S.dom === "tous") return true;
  const b = S.codeBook.get(code); const c = chapitre(b, ch);
  return !!(c ? c.d.includes(S.dom) : b && b.domaines.includes(S.dom));
}
function fnv(s) { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h >>> 0; }
const toksIdx = (s) => String(s || "").normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase().split(/[^a-z0-9]+/).filter((w) => w.length > 1 && !(S.STOPW || STOP).has(w));

/* passages */
function versAncien(b, x) { const c = chapitre(b, x.ch); return { b: b.id, ch: x.ch, ct: c ? c.t : "", id: x.id, pg: x.pg || [], sec: x.sec || "", ss: x.ss || "", t: x.t, f: x.f || [], e: x.e || [] }; }
async function lirePassagesParCle(cles) {
  const blocs = new Map();
  for (const k of cles) { const [c, n] = k.split(":").map(Number); const b = S.codeBook.get(c); if (!b) continue; const path = `pb/${b.id}-${Math.floor((n - 1) / (S.manifest.bloc || 16))}`; if (!blocs.has(path)) blocs.set(path, b); }
  const docs = await Promise.all([...blocs.keys()].map((p) => lireDoc(p).catch(() => null)));
  const out = new Map();
  [...blocs.entries()].forEach(([path, b], i) => { for (const x of (docs[i] && docs[i].p) || []) out.set(b.code + ":" + Number(x.id.split(":p")[1]), versAncien(b, x)); });
  return out;
}
async function lirePassage(id) {
  const [lid, pn] = String(id).split(":p"); const b = S.bookById.get(lid); if (!b || !pn) return null;
  const m = await lirePassagesParCle([b.code + ":" + Number(pn)]); return m.get(b.code + ":" + Number(pn)) || null;
}
async function searchTexts(terms, k) {
  if (!S.manifest) return [];
  const qs = [...new Set(terms.flatMap(toksIdx))].slice(0, 30);
  const phrases = [...new Set(terms.map(norm).filter((t) => t.length > 3))];
  const { n, N, avgdl } = S.manifest.ix;
  const seaux = [...new Set(qs.map((w) => fnv(w) % n))];
  const docs = await Promise.all(seaux.map((b) => lireDoc("ix/" + b).catch(() => null)));
  const parSeau = new Map(seaux.map((b, i) => [b, docs[i]]));
  const score = new Map();
  for (const w of qs) {
    const d = parSeau.get(fnv(w) % n), post = d && d.t[w]; if (!post) continue;
    const df = (d.df && d.df[w]) || post.length, idf = Math.log(1 + (N - df + 0.5) / (df + 0.5));
    for (const [c, num, ch, tf, len] of post) { if (!domOk(c, ch)) continue; const key = c + ":" + num; score.set(key, (score.get(key) || 0) + idf * (tf * 2.2) / (tf + 1.2 * (0.25 + 0.75 * len / avgdl))); }
  }
  const top = [...score].sort((a, b) => b[1] - a[1]).slice(0, Math.max(18, k * 2));
  const ps = await lirePassagesParCle(top.map((x) => x[0]));
  const out = [];
  for (let [key, s] of top) {
    const p = ps.get(key); if (!p) continue;
    const nn = norm(p.t), ss = norm(p.sec + " " + p.ct);
    for (const ph of phrases) { if (ss.includes(ph)) s += 10; else if (nn.includes(ph)) s += 5; }
    out.push({ score: s, p, window: windowFor({ p, n: nn }, phrases, qs) });
  }
  out.sort((a, b) => b.score - a.score);
  return out.slice(0, k);
}
function windowFor(d, phrases, qs, size = 3200) {
  const t = d.p.t; if (t.length <= size) return t;
  let at = -1;
  for (const ph of phrases) { at = d.n.indexOf(ph); if (at >= 0) break; }
  if (at < 0) for (const w of qs) { at = d.n.indexOf(w); if (at >= 0) break; }
  const start = Math.max(0, Math.min(t.length - size, (at < 0 ? 0 : at) - 700));
  return (start > 0 ? "… " : "") + t.slice(start, start + size) + (start + size < t.length ? " …" : "");
}

async function searchFigures(terms, k) {

  const qs = [...new Set(terms.flatMap(toksIdx))].slice(0, 20), phrases = [...new Set(terms.map(norm).filter((t) => t.length > 3))];
  const { n, N, avgdl } = S.manifest.lx;

  const docs = await Promise.all(seaux.map((b) => lireDoc("lx/" + b).catch(() => null)));
  const parSeau = new Map(seaux.map((b, i) => [b, docs[i]]));
  const score = new Map();
  for (const w of qs) {
    const d = parSeau.get(fnv(w) % n), post = d && d.t[w]; if (!post) continue;
    const df = (d.df && d.df[w]) || post.length, idf = Math.log(1 + (N - df + 0.5) / (df + 0.5));
    for (const [c, ch, rang, tf, len] of post) { if (!domOk(c, ch)) continue; const key = c + ":" + ch + ":" + rang; score.set(key, (score.get(key) || 0) + idf * (tf * 2.2) / (tf + 1.2 * (0.25 + 0.75 * len / avgdl))); }
  }
  const top = [...score].sort((a, b) => b[1] - a[1]).slice(0, k * 2);
  const chs = [...new Set(top.map(([key]) => key.split(":").slice(0, 2).join(":")))];
  await Promise.all(chs.map((x) => { const [c, ch] = x.split(":").map(Number); return figsChapitre(S.codeBook.get(c), ch); }));
  const out = [];

    const g = d && d.figs[rang]; if (!g) continue;
    const f = S.figById.get(g.id); let s = s0; const cn = norm(f.cap);
    for (const ph of phrases) if (cn.includes(ph)) s += 6;

}

const SECTIONS = [["definition", "Définition"], ["epidemiologie", "Épidémiologie"], ["etiologie", "Étiologie"], ["physiopathologie", "Physiopathologie et histologie"], ["clinique", "Clinique"]];
const MODAL = [["radiographie", "Radiographie"], ["scanner", "Scanner"], ["irm", "IRM (imagerie par résonance magnétique)"], ["echographie", "Échographie"], ["medecine_nucleaire", "Médecine nucléaire"]];
const LINE_KEYS = ["reponse", "a_retenir", "definition", "epidemiologie", "etiologie", "physiopathologie", "clinique", "sem_radiographie", "sem_scanner", "sem_irm", "sem_echographie", "sem_medecine_nucleaire", "classifications", "pieges", "evolution"];
function emptyFiche() { return { entite: "", synonymes: [], categorie: "", resume: "", reponse: [], a_retenir: [], definition: [], epidemiologie: [], etiologie: [], physiopathologie: [], clinique: [], semiologie: { radiographie: [], scanner: [], irm: [], echographie: [], medecine_nucleaire: [] }, classifications: [], differentiel: [], arbre: [], pieges: [], evolution: [], images: [] }; }
function addLine(f, o) {
  const refs = Array.isArray(o.r) ? o.r.map(String) : [];
  switch (o.k) {
    case "entite": f.entite = String(o.v || ""); break;
    case "synonymes": f.synonymes = Array.isArray(o.v) ? o.v.map(String) : []; break;
    case "categorie": f.categorie = String(o.v || ""); break;
    case "resume": f.resume = String(o.v || ""); break;
    case "differentiel": f.differentiel.push({ entite: String(o.entite || ""), signe: String(o.signe || ""), refs }); break;
    case "arbre": f.arbre.push({ question: String(o.question || ""), si_oui: String(o.si_oui || ""), si_non: String(o.si_non || ""), refs }); break;
    case "image": if (o.ref) f.images.push({ ref: String(o.ref), pourquoi: String(o.pourquoi || ""), role: o.role === "differentiel" ? "differentiel" : "entite", entite: String(o.entite || "") }); break;
    case "absent": f.absent = true; break;
    default:
      if (!LINE_KEYS.includes(o.k) || !o.t) return;
      if (o.k.startsWith("sem_")) f.semiologie[o.k.slice(4)].push({ t: String(o.t), refs });
      else f[o.k].push({ t: String(o.t), refs });
  }
}
function flatLines(f) { // every checkable statement, for verification
  const out = [];
  for (const k of LINE_KEYS) {
    const arr = k.startsWith("sem_") ? f.semiologie[k.slice(4)] : f[k];
    (arr || []).forEach((l, i) => out.push({ k, i, t: l.t, refs: l.refs }));
  }
  f.differentiel.forEach((d, i) => out.push({ k: "differentiel", i, t: `${d.entite} : ${d.signe}`, refs: d.refs }));
  f.arbre.forEach((a, i) => out.push({ k: "arbre", i, t: `${a.question} Oui : ${a.si_oui} Non : ${a.si_non}`, refs: a.refs }));
  return out;
}
function citedRefs(f) { const s = new Set(); flatLines(f).forEach((l) => (l.refs || []).forEach((r) => s.add(r))); (f.images || []).forEach((i) => s.add(i.ref)); return s; }

async function verifyFiche(doc, hits, figs) {

  figs.forEach((x, i) => { if (used.has("F" + (i + 1))) src.push(`[F${i + 1}] légende : ${x.cap}`); });
  const r = await S.sample.json(`Vérifie chaque affirmation numérotée contre les extraits qu'elle cite. Réponds uniquement par un objet JSON :
{"retirer": [numéros des affirmations absentes des extraits cités], "corriger": [{"n": numéro, "t": "version raccourcie à ce que les extraits étayent"}]}
Ne liste que les affirmations fautives ; si tout est étayé, renvoie des listes vides.

AFFIRMATIONS

EXTRAITS

  const drop = new Set((r && r.retirer || []).map(Number)), fix = new Map((r && r.corriger || []).map((c) => [Number(c.n), String(c.t || "")]));

async function runNote(noteId, { force = false } = {}) {

  if (S.owner && !S.manifest) { toast("La base des livres n'est pas joignable : recharge la page."); return; }
  const ctl = new AbortController(), signal = ctl.signal;
  const job = { id: noteId, ctl, steps: ["on", "", "", "", ""], detail: "Lecture de la note", ent: "", fiche: null, refs: null, t0: performance.now() };
  S.jobs.set(noteId, job); patchNote(noteId, { status: "run" }); render();

    const idP = identify(note.text, signal);
    let id;
    try { id = await idP; } catch (e) { if (e && e.code === "cancelled") throw e; const first = note.text.split(/[\n?.]/)[0].slice(0, 80); id = { entite: first, question: null, termes: [first] }; }
    job.ent = id.entite;
    const slugs = [...new Set([slugify(id.entite), ...id.termes.slice(0, 6).map(slugify)])];
    step(job, 0, "done", id.entite);
    patchNote(noteId, { entity: id.entite, slug: slugs[0] });
    const existing = !force && !id.question && findFiche(slugs);
    if (existing) { patchNote(noteId, { slug: existing.slug, status: "ok" }); done(job); return; }

    if (!S.owner) { done(job); patchNote(noteId, { status: "err" }); toast("Seul le propriétaire du corpus peut créer une fiche.", 6000); return; }

    step(job, 1, "on", "Recherche dans les livres");
    const hits = (await searchTexts(id.termes.concat(id.question ? [id.question] : []), 9)).filter((h) => h.score > 2);
    // the figures the passages point to, then the ones whose caption names the entity
    const figs = mergeFigs(await figsCitedIn(hits.map((h) => h.p), 30), await searchFigures(id.termes, 24)).slice(0, 45);
    step(job, 1, "done", `${hits.length} passages, ${figs.length} figures`);

    const refs = {};
    hits.forEach((h, i) => { refs["P" + (i + 1)] = { id: h.p.id, b: h.p.b, pg: h.p.pg, ct: h.p.ct, sec: h.p.sec }; });
    figs.forEach((f, i) => { refs["F" + (i + 1)] = { id: f.id, b: f.b, pg: f.pg, fig: f.fig, cap: f.cap }; });
    job.refs = refs;

    let doc;
    step(job, 2, "on", "Rédaction");
    const fiche = emptyFiche(); fiche.entite = id.entite; job.fiche = fiche;
    if (hits.length) await writeFicheStream(id, note.text, hits, figs, signal, (o) => { addLine(fiche, o); render(); });
    else fiche.absent = true;
    if (fiche.absent || !flatLines(fiche).length) {
      job.fiche = null; step(job, 2, "on", "Absente du corpus : recherche PubMed");
      let pm = { lignes: [], articles: [] };
      if (S.mcp) { try { pm = await pubmedSynthesis(id.entite, id.termes, null, signal); } catch (e) { if (e && e.code === "cancelled") throw e; pm.erreur = mcpCopy(e); } }

      doc = { kind: "pubmed", slug: slugs[0], alias: slugs, entite: id.entite, question: id.question, pubmed: pm, at: Date.now() };
    } else {
      step(job, 2, "done", "");
      step(job, 3, "on", "Recherche des images");
      try { const n = await pickImages(id, fiche, figs, refs, signal, job); step(job, 3, "done", `${n} image${n > 1 ? "s" : ""} retenue${n > 1 ? "s" : ""}`); }
      catch (e) { if (e && e.code === "cancelled") throw e; step(job, 3, "fail", "Sélection des images impossible : la fiche est enregistrée sans images."); }
      const used = citedRefs(fiche); for (const k of Object.keys(refs)) if (!used.has(k)) delete refs[k];

    await saveFiche(doc, job);

// Figures shown in a fiche are copied once into the artifact's file store, so people the page is shared with see them

async function uploadFicheImages(doc, job) {
  const known = new Map();
  for (const f of S.fiches.values()) for (const [fid, aid] of Object.entries(f.imgAssets || {})) known.set(fid, aid);
  const ids = [...new Set(doc.fiche.images.map((im) => doc.refs[im.ref]?.id).filter(Boolean))];
  const out = {}; let i = 0, done = 0;
  const worker = async () => {
    while (i < ids.length) {
      const fid = ids[i++];
      if (known.has(fid)) out[fid] = known.get(fid);
      else {
        const data = await figImage(fid, null, true); if (!data) continue;
        if (data.startsWith("/_blob/")) { out[fid] = data.slice(7); done++; continue; }
        try { out[fid] = (await S.assets.upload(await blobDe(data))).id; }
        catch (e) { if (e && (e.code === "quota_or_state" || e.code === "not_granted" || e.code === "capability_disabled")) throw e; }
      }
      done++; if (job) { job.detail = `Images partagées : ${done} / ${ids.length}`; render(); }
    }

function livrePondere() {
  const ls = S.books.filter((b) => S.dom === "tous" || b.domaines.includes(S.dom));
  const w = ls.map((b) => (b.id === "top3-msk" ? POIDS_TOP3 : 1) * Math.max(1, b.figures));
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < ls.length; i++) { r -= w[i]; if (r <= 0) return ls[i]; }
  return ls[ls.length - 1];
}
async function contexteLivre(f) {
  const cp = await lireDoc("cp/" + f.b).catch(() => null);
  const ids = (cp && cp[f.id]) || [];
  const ps = (await Promise.all(ids.slice(0, 2).map((id) => lirePassage(id).catch(() => null)))).filter(Boolean);
  return ps.map((p) => ({ id: p.id, src: srcLabel(p), t: p.t.length > 1600 ? p.t.slice(0, 1600) + " …" : p.t }));
}
function groupesFigures(figs) {
  const g = new Map();
  for (const f of figs) { const k = f.fig; if (!g.has(k)) g.set(k, []); g.get(k).push(f); }
  const out = [];
  for (const panels of g.values()) {
    panels.sort((x, y) => String(x.pa || "").localeCompare(String(y.pa || "")));
    const f0 = panels[0], cap = f0.capo || f0.cap || "";
    if (cap.length < 60 || f0.role === "schema" || (f0.m || []).includes("schema")) continue;
    if (!panels.every((p) => p.il || p.iv)) continue;
    const attendus = (f0.pn || []).length;
    if (attendus && panels.length < attendus) continue;               // un panneau cité sans image : cas incomplet
    if (panels.length > 8) continue;
    out.push(panels);
  }
  return out;
}
async function panneauxDe(f) {
  const b = S.bookById.get(f.b), tous = await figsChapitre(b, f.ch);
  const g = groupesFigures(tous.filter((x) => x.fig === f.fig));
  return g[0] || null;
}
async function preparerCas(source, livreId, etape) {

    const chs = b.chapitres.filter((c) => S.dom === "tous" || c.d.includes(S.dom)).map((c) => c.n);
    const ch = chs[Math.floor(Math.random() * chs.length)];
    etape(`Lecture des figures : ${b.court}, chapitre ${ch}`);
    const gs = groupesFigures(await figsChapitre(b, ch));
    if (gs.length) panels = gs[Math.floor(Math.random() * gs.length)];
  }
  if (!panels) throw { message: "Aucune figure complète et exploitable trouvée." };
  const f = panels[0], lettres = panels.map((p) => p.pa).filter(Boolean);
  etape("Lecture des passages qui citent la figure");
  const extraits = await contexteLivre(f).catch(() => []);

  const images = panels.map((p) => ({ id: p.id, lettre: p.pa || "", description: desc.get(String(p.pa || "").toLowerCase()) || (panels.length === 1 ? desc.get("") || [...desc.values()][0] || "" : "") }));
  const cb = chapitre(S.bookById.get(f.b), f.ch);
  return { f, panels: panels.map((p) => ({ id: p.id, pa: p.pa })), images, extraits, ctx: r, source: source && source.origine, livre: f.b, doms: cb ? cb.d : [], prepare: Date.now() };
}

  return `Tu construis un cas d'entraînement de radiologie pour un interne de 4e année, comme une vacation de lecture.

DONNÉES DU LIVRE (${bookShort(f.b)})
Légende de la figure : ${f.capo || f.cap}

  if (d.revnouv) { S.rev.construit = false; S.cas = { mode: "revision", etat: "vide" }; render(); return true; }

async function passagesChapitre(lid, ch) {
  const chb = await lireDoc("chb/" + lid); const r = chb && chb[ch]; if (!r) return [];
  const blocs = await Promise.all(Array.from({ length: r[1] - r[0] + 1 }, (_, k) => lireDoc(`pb/${lid}-${r[0] + k}`).catch(() => null)));
  return blocs.flatMap((d) => (d && d.p) || []).filter((p) => p.ch === ch);
}
function decouperEtapes(m) {
  const n = m.lesson.length, q = m.quiz.length, parts = Math.max(1, Math.min(3, Math.round(n / 3)));
  const subs = [];
  for (let k = 0; k < parts; k++) {
    const s0 = Math.floor(k * n / parts), s1 = Math.floor((k + 1) * n / parts), q0 = Math.floor(k * q / parts), q1 = Math.floor((k + 1) * q / parts);
    const secs = Array.from({ length: s1 - s0 }, (_, i) => s0 + i);
    subs.push({ hs: secs.map((i) => m.lesson[i].h), secs, qs: Array.from({ length: q1 - q0 }, (_, i) => q0 + i) });
  }
  return subs;
}

function entitesFiltrees() {

  if (S.manifest === undefined) return `<p class="hint">Lecture du sommaire de l'index…</p>`;
  if (!S.manifest) return `<div class="alert"><b>Index indisponible</b><span>${esc(messageCorpus())} <button class="btn small" data-retry-meta="1">Réessayer</button></span></div>`;
  const lv = livresVisibles(), tot = lv.reduce((a, b) => [a[0] + b.passages, a[1] + b.figures], [0, 0]);
  const seg = `<div class="seg" role="tablist"><button role="tab" aria-selected="${S.bib.vue === "ouvrages"}" data-bvue="ouvrages">Ouvrages</button><button role="tab" aria-selected="${S.bib.vue === "entites"}" data-bvue="entites">Entités</button></div>`;
  const stats = `<div class="bstats"><span><b>${lv.length}</b> ouvrages</span><span><b>${tot[0].toLocaleString("fr-BE")}</b> passages</span><span><b>${tot[1].toLocaleString("fr-BE")}</b> figures</span><span><b>${entitesVisibles().length.toLocaleString("fr-BE")}</b> entités</span></div>`;
  if (S.bib.vue === "ouvrages") {
    const g = {}; for (const b of lv) (g[b.domaine] = g[b.domaine] || []).push(b);
    return seg + stats + Object.entries(g).map(([d, bs]) => `<h3 class="grp">${esc(libDomaine(d))}</h3><ul class="entlist">${bs.map((b) => `<li><button class="item${S.bib.livre === b.id ? " on" : ""}" data-livre="${esc(b.id)}"><b>${esc(b.court)}</b><span>${esc(b.titre)}</span><span class="mono">${b.chapitres.length} chapitres · ${b.passages.toLocaleString("fr-BE")} passages · ${b.figures.toLocaleString("fr-BE")} figures${b.id === "top3-msk" ? " · banque de cas" : ""}</span></button></li>`).join("")}</ul>`).join("");
  }
  const cats = Object.keys(CAT), regs = [...new Set(entitesVisibles().flatMap((e) => e.r))].sort((a, b) => libRegion(a).localeCompare(libRegion(b), "fr"));
  const l = entitesFiltrees(), vis = l.slice(0, 250);
  return seg + stats + `<div class="filtres">
    <div class="chips">${["", ...cats].map((c) => `<button class="chip${S.bib.cat === c ? " on" : ""}" data-bcat="${c}">${c ? esc(CAT[c]) : "Toutes"}</button>`).join("")}</div>
    <label class="sr" for="bReg">Région</label><select id="bReg"><option value="">Toutes les régions</option>${regs.map((r) => `<option value="${esc(r)}" ${S.bib.reg === r ? "selected" : ""}>${esc(libRegion(r))}</option>`).join("")}</select></div>
  ${S.entState === "loading" ? `<p class="hint">Chargement du catalogue…</p>` : S.entState === "error" ? `<div class="alert"><b>Catalogue indisponible</b><span><button class="btn small" data-retry-ent="1">Réessayer</button></span></div>` : ""}
  <p class="hint">${plural(l.length, "entité")}${S.bq ? ` pour « ${esc(S.bq)} »` : ""}</p>
  <ul class="entlist">${vis.map((e) => `<li><button class="item${S.entSel === e.i ? " on" : ""}" data-ent="${esc(e.i)}"><b>${esc(e.n)}</b><span>${esc(CAT[e.c] || e.c)}${e.r.length ? " · " + esc(e.r.slice(0, 2).map(libRegion).join(", ")) : ""}</span><span class="mono">${e.np} passages · ${e.nf} figures</span></button></li>`).join("")}</ul>
  ${l.length > vis.length ? `<p class="hint">${l.length - vis.length} autres : affine la recherche.</p>` : ""}`;
}
async function ouvrirLivre(id, ch) {
  S.bib.livre = id; S.bib.ch = ch ?? null; S.entSel = null; S.detail = true;
  S.entView = ch == null ? { type: "livre", id } : { type: "chap", id, ch, state: "loading" }; render();
  if (ch == null) return;
  const b = S.bookById.get(id);
  try {
    const [figs, ps] = await Promise.all([figsChapitre(b, ch), passagesChapitre(id, ch)]);
    if (S.bib.ch !== ch || S.bib.livre !== id) return;
    S.entView = { type: "chap", id, ch, state: "ok", figs, ps };
  } catch (e) { S.entView = { type: "chap", id, ch, state: "err", err: messageErreur(e) }; }
  render();
}
async function ouvrirEntite(id) {
  S.entSel = id; S.bib.livre = null; S.entView = { type: "ent", id, state: "loading" }; S.detail = true; render();
  try {
    const d = await detailEntite(id);
    const pids = (d?.p || []).slice(0, 12), fids = (d?.f || []).slice(0, 30);
    const [ps, figs] = await Promise.all([Promise.all(pids.map((p) => lirePassage(p).catch(() => null))), figsParId(fids)]);
    if (S.entSel !== id) return;
    S.entView = { type: "ent", id, state: "ok", d, ps: ps.filter(Boolean), figs, totP: (d?.p || []).length, totF: (d?.f || []).length };
  } catch (e) { S.entView = { type: "ent", id, state: "err", err: messageErreur(e) }; }
  render();
}
function ficheDeEntite(e) {
  const slugs = new Set([slugify(e.n), ...e.s.map(slugify)]);
  return [...S.fiches.values()].find((f) => slugs.has(f.slug) || (f.alias || []).some((a) => slugs.has(a)));
}
function grilleFigures(figs, ent) {
  S.lb = { list: figs.map((g) => ({ id: g.id, cap: g.cap, src: `${bookShort(g.b)}, fig. ${g.fig}${g.pa || ""}${g.pg ? `, p. ${g.pg}` : ""}`, dd: "", slug: null, ent })), i: 0 };
  return figs.length ? `<div class="bthumbs">${figs.map((g, i) => `<button class="bthumb" data-lb="${i}" title="${esc(g.cap.slice(0, 160))}"><img data-img="${esc(g.id)}" alt="${esc(g.cap.slice(0, 120))}"><span>${esc(bookShort(g.b))} · fig. ${esc(g.fig)}${esc(g.pa || "")}</span></button>`).join("")}</div>` : `<p class="hint">Aucune figure.</p>`;
}
function listePassages(ps) {
  return ps.map((p) => `<article class="psg"><span class="mono">${esc(srcLabel(p))}</span><p>${esc(p.t.length > 700 ? p.t.slice(0, 700) + " …" : p.t)}</p><button class="btn small" data-ref="${esc(p.id)}">Lire en entier</button></article>`).join("") || `<p class="hint">Aucun passage.</p>`;
}
function biblioDroite() {
  const v = S.entView;
  if (!v) return `<div class="bempty"><h2>Bibliothèque</h2><p>Tout ce que l'application peut lire dans l'index : les ouvrages et leurs chapitres, les figures avec leur légende, et le catalogue des entités pathologiques. Choisis un ouvrage ou une entité à gauche.</p>${S.manifest ? `<p class="hint">Index version ${esc(S.manifest.version)} · lu depuis l'ouverture : ${S.lus.docs} fichiers, ${(S.lus.octets / 1024).toFixed(0)} Ko.</p>` : ""}</div>`;
  const back = `<button class="btn small bback" data-back="1">‹ Liste</button>`;
  if (v.type === "livre") {
    const b = S.bookById.get(v.id); if (!b) return "";
    return back + `<span class="label">${esc(libDomaine(b.domaine))}${b.id === "top3-msk" ? " · banque de cas" : ""}</span><h1 class="btitle">${esc(b.titre)}</h1>
      <p class="hint">${esc(b.auteurs.join(", "))}${b.annee ? ` · ${b.annee}` : ""} · ${b.langue === "fr" ? "français" : "anglais"} · ${b.passages.toLocaleString("fr-BE")} passages · ${b.figures.toLocaleString("fr-BE")} figures</p>
      <ol class="chaps">${b.chapitres.filter((c) => S.dom === "tous" || c.d.includes(S.dom)).map((c) => `<li><button data-livre="${esc(b.id)}" data-chap="${c.n}"><span class="n">${c.n}</span><span class="t">${esc(c.t)}</span><span class="p mono">${c.p && c.p[0] ? `p. ${esc(c.p[0])}–${esc(c.p[1])}` : ""}</span>${c.d.length > 1 ? `<span class="d">${esc(c.d.filter((x) => x !== b.domaine).map(libDomaine).join(", "))}</span>` : ""}</button></li>`).join("")}</ol>`;
  }
  if (v.type === "chap") {
    const b = S.bookById.get(v.id), c = chapitre(b, v.ch);
    const head = back + `<button class="btn small" data-livre="${esc(b.id)}">‹ ${esc(b.court)}</button><span class="label">${esc(b.court)} · chapitre ${v.ch}</span><h1 class="btitle">${esc(c ? c.t : "")}</h1>`;
    if (v.state === "loading") return head + `<p class="hint">Lecture du chapitre dans l'index…</p>`;
    if (v.state === "err") return head + `<div class="alert"><b>Lecture impossible</b><span>${esc(v.err)} <button class="btn small" data-livre="${esc(b.id)}" data-chap="${v.ch}">Réessayer</button></span></div>`;
    return head + `<h2 class="bsech">Figures <span class="hint">${v.figs.length}</span></h2>${grilleFigures(v.figs, c ? c.t : "")}
      <h2 class="bsech">Passages <span class="hint">${v.ps.length}</span></h2>${listePassages(v.ps.slice(0, 40))}${v.ps.length > 40 ? `<p class="hint">${v.ps.length - 40} autres passages dans ce chapitre.</p>` : ""}`;
  }
  const e = S.ent.get(v.id); if (!e) return "";
  const f = ficheDeEntite(e);
  const head = back + `<span class="label">${esc(CAT[e.c] || e.c)} · ${esc(e.d.map(libDomaine).join(", "))}</span><h1 class="btitle">${esc(e.n)}</h1>
    ${e.s.length || e.a.length ? `<p class="hint">Aussi : ${esc([...e.a, ...e.s].slice(0, 12).join(" · "))}</p>` : ""}
    ${e.r.length ? `<p class="hint">Régions : ${esc(e.r.map(libRegion).join(", "))}</p>` : ""}
    <div class="row">${f ? `<button class="btn primary small" data-fiche="${esc(f.slug)}">Ouvrir la fiche</button>` : S.sample ? `<button class="btn primary small" data-genent="${esc(e.i)}">Créer la fiche</button>` : ""}</div>`;
  if (v.state === "loading") return head + `<p class="hint">Lecture des passages et des figures…</p>`;
  if (v.state === "err") return head + `<div class="alert"><b>Lecture impossible</b><span>${esc(v.err)} <button class="btn small" data-ent="${esc(e.i)}">Réessayer</button></span></div>`;
  const liees = (v.d?.l || []).map((x) => S.ent.get(x)).filter(Boolean);
  return head + `${liees.length ? `<h2 class="bsech">Entités liées</h2><div class="chips">${liees.map((x) => `<button class="chip" data-ent="${esc(x.i)}">${esc(x.n)}</button>`).join("")}</div>` : ""}
    <h2 class="bsech">Figures <span class="hint">${v.totF > v.figs.length ? `${v.figs.length} sur ${v.totF}` : v.figs.length}</span></h2>${grilleFigures(v.figs, e.n)}
    <h2 class="bsech">Passages <span class="hint">${v.totP > v.ps.length ? `${v.ps.length} sur ${v.totP}` : v.ps.length}</span></h2>${listePassages(v.ps)}`;
}
function clicBiblio(t) {
  const d = t.dataset;
  if (d.bvue) { S.bib.vue = d.bvue; if (d.bvue === "entites" && S.entState === "idle") chargerEntites(); render(); return true; }
  if (d.bcat !== undefined && t.matches("[data-bcat]")) { S.bib.cat = d.bcat; render(); return true; }
  if (d.livre) { ouvrirLivre(d.livre, d.chap != null ? +d.chap : null); return true; }
  return false;
}

/* ================= Révision unifiée : une seule file, un élément toujours prêt =================
   Sources mélangées : erreurs de QCM et de défis d'Apprentissage (même enregistrement que Learning),
   QCM ratés sur les notes, cas ratés, cas tirés des figures des fiches, QCM générés sur les notes,
   QCM d'images Top 3. L'élément suivant est préparé pendant qu'on répond au courant. */
S.rev = { file: [], pos: 0, construit: false, fait: 0, bons: 0 };
function melanger(a) { for (let i = a.length - 1; i > 0; i--) { const k = Math.floor(Math.random() * (i + 1)); [a[i], a[k]] = [a[k], a[i]]; } return a; }
function construireFile() {
  const LR = window.LR, f = [];
  if (LR) for (const x of LR.dueMissed(null).slice(0, 15)) f.push({ type: "lr", mid: x.m.id, i: x.i, lib: "Erreur d'Apprentissage" });
  for (const q of S.casHist.qcm.slice(-8)) f.push({ type: "qcm", q, lib: "QCM raté sur tes notes", err: true });
  const rates = [...new Set(S.casHist.hist.filter((h) => h.note < 6).map((h) => h.fid))].slice(-6);
  for (const fid of rates) f.push({ type: "cas", fid, origine: "ratés", lib: "Cas à refaire" });
  const figsNotes = [];
  for (const fi of S.fiches.values()) for (const [k, r] of Object.entries(fi.refs || {})) if (k.startsWith("F") && r.id) figsNotes.push(r.id);
  for (const fid of melanger([...new Set(figsNotes)]).slice(0, 3)) f.push({ type: "cas", fid, origine: "notes", lib: "Cas sur tes notes" });
  if ([...S.fiches.values()].some((x) => x.kind === "corpus")) f.push({ type: "gen", gen: "notes", lib: "QCM sur tes notes" });
  if (S.bookById.has("top3-msk")) f.push({ type: "gen", gen: "top3", lib: "QCM d'images Top 3" });
  const lr = f.filter((x) => x.type === "lr"), autres = melanger(f.filter((x) => x.type !== "lr"));
  const file = [];                                   // erreurs d'Apprentissage en tête, puis alternance
  while (lr.length || autres.length) { if (lr.length) file.push(lr.shift()); if (lr.length) file.push(lr.shift()); if (autres.length) file.push(autres.shift()); }
  S.rev = { file, pos: 0, construit: true, fait: 0, bons: 0 };
  preparer(0); preparer(1);
}
function qcmDepuisLR(it) {
  const m = window.LR.modById[it.mid], q = m && m.quiz[it.i]; if (!q) return null;
  return { question: q.q, options: q.options, reponse: q.answer, explication: q.explain || "", lrimg: q.img || "", ref: `${m.chapter || ""}${q.ref ? " · " + q.ref : ""} · ${m.title}` };
}
function preparer(k) {
  const it = S.rev.file[k]; if (!it || it.p) return;
  if (it.type === "lr") { it.pret = qcmDepuisLR(it); it.p = Promise.resolve(); return; }
  if (it.type === "qcm") { it.pret = it.q; it.p = Promise.resolve(); return; }
  if (it.type === "cas") { it.p = preparerCas({ fid: it.fid, origine: it.origine }).then((c) => { it.pret = c; }).catch((e) => { it.err = messageErreur(e); }).finally(render); return; }
  if (it.type === "gen") {
    it.p = (it.gen === "notes" ? genQcmNotes() : genQcmTop3()).then((qs) => {
      const items = qs.map((q) => ({ type: "qcm", q, pret: q, p: Promise.resolve(), lib: it.lib }));
      const pos = S.rev.file.indexOf(it); if (pos >= 0) S.rev.file.splice(pos, 1, ...items);
    }).catch((e) => { it.err = messageErreur(e); }).finally(render);
  }
}
function itemCourant() { return S.rev.file[S.rev.pos]; }
function revSuivant() {
  S.rev.pos++; S.cas = { mode: "revision", etat: "vide" };
  preparer(S.rev.pos); preparer(S.rev.pos + 1);
  const it = itemCourant(); if (it && it.type === "cas" && it.pret) S.cas = { mode: "revision", etat: "question", ...it.pret };
  render(); window.scrollTo(0, 0);
}
function revRepondre(i) {
  const it = itemCourant(); if (!it || it.choix != null) return;
  const q = it.pret; it.choix = i; const ok = i === q.reponse;
  S.rev.fait++; if (ok) S.rev.bons++;
  if (it.type === "lr" && window.LR) window.LR.repondre(it.mid, it.i, i);
  else if (!ok && !it.err) { S.casHist.qcm.push({ ...q, at: Date.now() }); sauverCasHist(); }
  else if (ok && it.err) { S.casHist.qcm = S.casHist.qcm.filter((x) => x.question !== q.question); sauverCasHist(); }
  render();
}
function revContenu() {
  if (!S.rev.construit) construireFile();
  const R = S.rev, it = itemCourant(), total = R.file.length;
  const tete = `<div class="revhead"><span class="label">${it ? esc(it.lib) : "Révision"}</span><span class="hint">${Math.min(R.pos + 1, total)} / ${total}${R.fait ? ` · ${R.bons} / ${R.fait} réussis` : ""}</span>
    <span class="revbar"><i style="width:${total ? Math.round(100 * R.pos / total) : 0}%"></i></span></div>`;
  if (!total) return tete + `<div class="bempty"><h2>Rien à réviser</h2><p>Les erreurs de QCM et de défis d'Apprentissage, les cas ratés et des QCM sur les entités de tes notes apparaîtront ici.</p><button class="btn primary" data-casmode="alea">Faire un cas aléatoire</button></div>`;
  if (!it) return tete + `<div class="bempty"><h2>Révision terminée</h2><p>${R.bons} bonnes réponses sur ${R.fait}. Les éléments ratés reviendront dans une prochaine révision.</p><div class="row"><button class="btn primary" data-revnouv="1">Nouvelle révision</button><button class="btn small" data-casmode="alea">Cas aléatoire</button></div></div>`;
  if (it.err) return tete + `<div class="alert"><b>Élément indisponible</b><span>${esc(it.err)} <button class="btn small" data-rsuiv="1">Passer</button></span></div>`;
  if (!it.pret) { preparer(R.pos); return tete + `<div class="bempty"><h2>Préparation…</h2><p class="hint">${it.type === "cas" ? "Claude construit le cas à partir du livre." : "Claude écrit les questions."}</p></div>`; }
  if (it.type === "cas") { S.cas = { mode: "revision", etat: "question", ...it.pret }; return casContenu(); }
  const q = it.pret, c = it.choix;
  const img = q.lrimg ? `<figure class="casfig"><img data-lrimg="${esc(q.lrimg)}" alt="Image de la question"></figure>` : q.fid ? `<figure class="casfig"><img data-img="${esc(q.fid)}" data-full="1" alt="Image de la question"></figure>` : "";
  return tete + img + `<h2 class="btitle" style="font-size:20px">${esc(q.question)}</h2>
    <div class="qopts">${q.options.map((o, i) => `<button class="qopt${c == null ? "" : i === q.reponse ? " ok" : i === c ? " ko" : ""}" data-rrep="${i}" ${c == null ? "" : "disabled"}>${esc(o)}</button>`).join("")}</div>
    ${c != null ? `<div class="fb ${c === q.reponse ? "ok" : "ko"}"><h3>${c === q.reponse ? "Bonne réponse" : "Réponse attendue : " + esc(q.options[q.reponse] || "")}</h3><p>${esc(q.explication || "")}</p>${q.ref ? `<p class="hint">${esc(q.ref)}</p>` : ""}</div><div class="row"><button class="btn primary" data-rsuiv="1">Élément suivant</button></div>` : ""}`;
}

document.addEventListener("click", (e) => {
  const tc = e.target.closest("[data-casmode],[data-tirer],[data-corriger],[data-qrep],[data-qnext],[data-col],[data-rrep],[data-rsuiv],[data-revnouv]");
  if (tc && !tc.disabled && clicCas(tc)) return;
  const tb = e.target.closest("[data-bvue],[data-bcat],[data-livre]");
  if (tb && clicBiblio(tb)) return;
  const t = e.target.closest("[data-tab],[data-ent],[data-progimp],[data-genent],[data-retry-ent],[data-retry-meta],[data-fiche]");
  if (!t) return;
  const d = t.dataset;
  if (d.tab) { S.tab = d.tab; S.detail = false; $("q").value = d.tab === "biblio" ? S.bq : S.query; if (d.tab === "biblio" && S.entState === "idle") chargerEntites(); history.replaceState(null, "", d.tab === "biblio" ? "#bibliotheque" : location.pathname + location.search); render(); }
  else if (d.ent) ouvrirEntite(d.ent);
  else if (d.retryMeta) { S.manifest = undefined; render(); loadCorpusMeta(); }
  else if (d.progimp) importerProgression();
  else if (d.retryEnt) { S.entState = "idle"; chargerEntites(); }
  else if (d.genent) {
    const en = S.ent.get(d.genent); if (!en) return;
    const id = "n" + Date.now().toString(36), note = { kind: "note", text: en.n, at: Date.now(), status: "run" };
    S.tab = "notes"; S.notes.unshift({ id, ...note }); openView({ type: "note", id });
    if (S.uid) notesCol().doc(id).set(note).catch(() => {});
    runNote(id);
  } else if (d.fiche) { S.tab = "notes"; }
});
$("right").addEventListener("change", () => {});
$("left").addEventListener("change", (e) => { if (e.target.id === "bReg") { S.bib.reg = e.target.value; render(); } });
$("domSel").onchange = () => changerDomaine($("domSel").value);
if (location.hash === "#bibliotheque") S.tab = "biblio";

/* ================= boot ================= */
render();
(async () => {
  const [db, user, sample, mcp, assets] = await Promise.all(["db", "user", "sample", "mcp", "assets"].map((n) => window.claude.use(n).catch(() => null)));
  S.db = db; S.user = user; S.sample = sample; S.mcp = mcp; S.assets = assets;
  if (user) { try { S.owner = !!(await user.isOwner()) || !!(await user.canEdit()); } catch {} try { S.uid = await user.id(); } catch {} }
  S.booted = true;
  if (!db) { toast("La base de l'artefact ne répond pas : les fiches ne peuvent pas s'afficher."); render(); return; }
  const slow = setTimeout(() => toast("La base met du temps à répondre : la connexion est peut-être lente."), 10000);
  db.collection("fiches").onSnapshot((snap) => {
    clearTimeout(slow);
    for (const ch of snap.docChanges()) { if (ch.type === "removed") S.fiches.delete(ch.doc.id); else S.fiches.set(ch.doc.id, { slug: ch.doc.id, ...ch.doc.data() }); }
    if (S.pendingSlug && S.fiches.has(S.pendingSlug)) { const s = S.pendingSlug; S.pendingSlug = null; S.view = { type: "fiche", slug: s }; S.detail = true; }
    render();
  }, () => clearTimeout(slow));
  if (S.uid) notesCol().orderBy("at", "desc").limit(500).onSnapshot((snap) => {
    const local = new Map(S.notes.map((n) => [n.id, n]));
    const remote = snap.docs.filter((d) => d.data().kind === "note").map((d) => ({ ...d.data(), ...(local.get(d.id) || {}), id: d.id }));
    for (const n of local.values()) if (!remote.find((r) => r.id === n.id)) remote.push(n);
    S.notes = remote.sort((a, b) => b.at - a.at); render();
  }, () => {});
  loadCorpusMeta().then(() => setTimeout(reparerImagesFiches, 3000));
  chargerProgression(); chargerCasHist().then(chargerReserve).then(() => { render(); setTimeout(remplirReserve, 1500); });
})();
routeFromHash();
</script>
